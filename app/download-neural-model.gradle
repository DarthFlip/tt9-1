// Downloads CleverKeys' swipe-typing encoder + decoder ONNX models to
// app/src/main/assets/models/ so NeuralGlideDecoder can load them at runtime.
// Both files are GPL-3.0 (same license as tt9 — no separate attribution required),
// so they could be committed; kept out of git to keep the repo small and let the
// build pull the canonical upstream.
//
// Wired into mergeAssets via the apply block below — idempotent: skips when the
// file already exists with the right SHA256.

def neuralModelDir = file("${projectDir}/src/main/assets/models")
def encoderFile = new File(neuralModelDir, "swipe_encoder.onnx")
def decoderFile = new File(neuralModelDir, "swipe_decoder.onnx")
def encoderSha256 = "964c721783df57a0a98aec67fb7db84732e0139d1b5ef9ff08c5b1fd2480f817"
def decoderSha256 = "b438984986dbb0afeeac9551dcba8fc2ea87eea6bb011a0381dd93cc8cf92c0d"
def encoderUrl = "https://raw.githubusercontent.com/tribixbite/CleverKeys/main/src/main/assets/models/swipe_encoder_android.onnx"
def decoderUrl = "https://raw.githubusercontent.com/tribixbite/CleverKeys/main/src/main/assets/models/swipe_decoder_android.onnx"

tasks.register('downloadNeuralModel') {
	outputs.file encoderFile
	outputs.file decoderFile

	doLast {
		neuralModelDir.mkdirs()
		fetchIfMissing(encoderFile, encoderUrl, encoderSha256, "swipe encoder")
		fetchIfMissing(decoderFile, decoderUrl, decoderSha256, "swipe decoder")
	}
}

androidComponents {
	onVariants(selector().all()) { variant ->
		def variantName = variant.name.capitalize()
		tasks.matching { it.name == "merge${variantName}Assets" }.configureEach {
			dependsOn(downloadNeuralModel)
		}
	}
}

def fetchIfMissing(File f, String url, String expectedSha, String label) {
	if (f.exists() && sha256Of(f) == expectedSha) return
	logger.lifecycle("downloading CleverKeys $label (${url})")
	downloadTo(url, f)
	def actual = sha256Of(f)
	if (actual != expectedSha) {
		throw new GradleException(
			"SHA256 mismatch for ${f.name}: expected ${expectedSha}, got ${actual}"
		)
	}
}

static String sha256Of(File f) {
	def md = java.security.MessageDigest.getInstance("SHA-256")
	f.withInputStream { is ->
		def buf = new byte[8192]
		int n
		while ((n = is.read(buf)) != -1) md.update(buf, 0, n)
	}
	return md.digest().collect { String.format('%02x', it) }.join('')
}

static void downloadTo(String urlStr, File dest) {
	def url = new URL(urlStr)
	def conn = url.openConnection()
	conn.setInstanceFollowRedirects(true)
	conn.connect()
	conn.inputStream.withCloseable { input ->
		dest.withOutputStream { out -> out << input }
	}
}
