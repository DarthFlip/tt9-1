// CleverKeys' swipe-typing encoder + decoder weights are committed to this repo as
// ORT-format files (app/src/main/assets/models/swipe_*.ort). CleverKeys is GPL-3.0 —
// same license as tt9 — so the weights can live in-tree without license friction.
//
// We re-encoded from the upstream .onnx → .ort via:
//   python -m onnxruntime.tools.convert_onnx_models_to_ort \
//     --optimization_style Runtime --target_platform arm <dir>/
// ORT format guarantees flatbuffer 4-byte alignment, fixing the SIGBUS/BUS_ADRALN
// crash ORT 1.20-1.26 hits when loading raw .onnx on the F1's strict-alignment armv7.
//
// This task remains as a safety net for clean checkouts: if the .ort files somehow go
// missing, fetch raw .onnx from upstream and re-encode via a local Python+onnxruntime
// install. Skipped on every normal build.

def neuralModelDir = file("${projectDir}/src/main/assets/models")
def encoderOrt = new File(neuralModelDir, "swipe_encoder.ort")
def decoderOrt = new File(neuralModelDir, "swipe_decoder.ort")
def encoderUrl = "https://raw.githubusercontent.com/tribixbite/CleverKeys/main/src/main/assets/models/swipe_encoder_android.onnx"
def decoderUrl = "https://raw.githubusercontent.com/tribixbite/CleverKeys/main/src/main/assets/models/swipe_decoder_android.onnx"

tasks.register('downloadNeuralModel') {
	outputs.file encoderOrt
	outputs.file decoderOrt

	doLast {
		if (encoderOrt.exists() && decoderOrt.exists()) return
		throw new GradleException(
			"Missing ORT model files: ${encoderOrt.name}, ${decoderOrt.name}. " +
			"To regenerate from upstream:\n" +
			"  curl -L -o /tmp/enc.onnx ${encoderUrl}\n" +
			"  curl -L -o /tmp/dec.onnx ${decoderUrl}\n" +
			"  python -m onnxruntime.tools.convert_onnx_models_to_ort " +
			"--optimization_style Runtime --target_platform arm /tmp/\n" +
			"  cp /tmp/enc.with_runtime_opt.ort ${encoderOrt}\n" +
			"  cp /tmp/dec.with_runtime_opt.ort ${decoderOrt}"
		)
	}
}

androidComponents {
	onVariants(selector().all()) { variant ->
		def variantName = variant.name.capitalize()
		tasks.matching { it.name == "merge${variantName}Assets" }.configureEach {
			dependsOn(downloadNeuralModel)
		}
	}
}
